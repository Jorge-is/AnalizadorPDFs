<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Registro - Analizador RSL</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    </head>
    <body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <header style="text-align: center; margin-bottom: 2rem;">
            <h1>Crear Cuenta</h1>
            <p class="intro-text">Comienza a organizar y analizar tus papers.</p>
        </header>

        <div class="container" style="max-width: 400px; margin: 0 auto; padding: 2rem; display: block;">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="error-message" style="margin-bottom: 1rem;">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}" class="form-section" style="display: block;">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Usuario</label>
                    <input type="text" name="username" required style="width: 100%; border-radius: 6px; border: 1px solid #ccc; padding: 10px;" />
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Contraseña</label>
                    <input type="password" name="password" required style="width: 100%; border-radius: 6px; border: 1px solid #ccc; padding: 10px;" />
                </div>
                <button type="submit" class="btn" style="width: 100%;">Registrarse</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem;">
                ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" style="color: #007bff;">Inicia Sesión</a>
            </p>
        </div>
    </body>
</html>
